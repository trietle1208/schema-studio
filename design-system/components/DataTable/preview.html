<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataTable — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement, useState = React.useState;
function App(){
  var _s = useState({key:'updatedRank',dir:'asc'}), s = _s[0], setS = _s[1];
  var rows = S.sample.schemas.slice().sort(function(a,b){ var x=a[s.key], y=b[s.key]; var r = x<y?-1:x>y?1:0; return s.dir==='asc'?r:-r; });
  return h('div',{style:{background:'var(--bg-2)',padding:'8px 0'}}, h(S.DataTable,{rowKey:'name',selectedKey:'ecommerce',sort:s,onSort:setS,rows:rows,columns:[
    {key:'name',label:'Name',render:function(r){ return h('span',{className:'ss-row'},h(S.Icon,{name:'database',size:14,style:{color:'var(--ink-3)'}}),h('span',{className:'ss-mono',style:{fontWeight:500}},r.name)); }},
    {key:'engine',label:'Database',render:function(r){ return h(S.Badge,{dot:true},r.engine); }},
    {key:'tables',label:'Tables',numeric:true,align:'right',render:function(r){ return r.tables+' tables'; }},
    {key:'version',label:'Version',render:function(r){ return h(S.Badge,null,r.version); }},
    {key:'updatedRank',label:'Updated',render:function(r){ return h('span',{className:'ss-muted'},r.updated); }}]}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
