<!doctype html>
<html>
<head><meta charset="utf-8"><title>TableList — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement, useState = React.useState;
function App(){
  var _s = useState('users'), s = _s[0], setS = _s[1];
  var counts = {}; S.sample.tables.forEach(function(t){ counts[t.name] = S.sample.records[t.name].length; });
  return h('div',{style:{height:520,display:'flex'}}, h(S.TableList,{tables:S.sample.tables,counts:counts,selected:s,onSelect:setS}));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
