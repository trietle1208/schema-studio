<script>

var TABLES = S.sample.tables;

// 1,248 users: the 20 of the sample first, then more of the same kind up to the sample's "today".
function stamp(ms) { return new Date(ms).toISOString().slice(0, 19).replace('T', ' '); }
function manyUsers(n) {

  return Array.from({ length: n }, function (_, i) {

// A throwaway evaluator so the filters, the search and the sort of this preview do something.
function test(row, f) {
  var v = row[f.column];
  if (f.op === 'IS NULL') return v == null;
  if (f.op === 'IS NOT NULL') return v != null;
  if (v == null) return false;
  if (f.op === 'LIKE') return new RegExp('^' + String(f.value).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/%/g, '.*').replace(/_/g, '.') + '$', 'i').test(String(v));

function plural(n, one, many) { return n.toLocaleString('en-US') + ' ' + (n === 1 ? one : many); }

  }

  var dialog = deleting && h(S.ConfirmDialog, { title: 'Delete ' + plural(deleting.length, 'row', 'rows') + ' from "' + name + '"?', danger: true, confirmLabel: deleting.length === 1 ? 'Delete row' : 'Delete ' + deleting.length + ' rows', onCancel: function () { setConfirm(null); }, onConfirm: doDelete },
