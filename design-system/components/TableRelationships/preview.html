<!doctype html>
<html>
<head><meta charset="utf-8"><title>TableRelationships — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%} .cap{padding:10px 16px 6px}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement, useState = React.useState;
var T = S.sample.tables;
function Block(p){ return h('div',{style:{display:'flex',flexDirection:'column',height:p.height,background:'var(--bg-1)',borderTop:'1px solid var(--line-1)'}}, h('div',{className:'cap ss-caption',style:{background:'var(--bg-2)'}},p.title), p.children); }
function App(){
  var _o = useState(null), opened = _o[0], setOpened = _o[1];
  return h('div',null,
    h(Block,{title:'orders · one foreign key out, two in' + (opened ? ' · Open in Data: ' + opened : ''),height:352}, h(S.TableRelationships,{table:T[1],tables:T,onOpen:setOpened})),
    h(Block,{title:'users · nothing out',height:262}, h(S.TableRelationships,{table:T[0],tables:T})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
