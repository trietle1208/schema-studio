  var _c = useState(2), cur = _c[0], setCur = _c[1];

    h(Row, { title: 'Last step', current: 3, onStep: function () { } }),
    h('div', null, h('div', { className: 'cap ss-caption' }, 'Working'), h(S.Stepper, { steps: STEPS, current: cur, onStep: setCur }),
