<!-- @dsCard group="Import & export" height=220 width=640 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Progress — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%} .cap{display:flex;justify-content:space-between;font:400 12px/16px var(--font-mono);color:var(--ink-2);margin-bottom:6px}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement;
function Row(p) { return h('div', null, h('div', { className: 'cap' }, h('span', null, p.title), h('span', null, p.value + '%')), h(S.Progress, { value: p.value, max: 100, tone: p.tone, label: p.title })); }
function App() {
  return h('div', { style: { padding: 16, display: 'flex', flexDirection: 'column', gap: 16, background: 'var(--bg-2)' } },
    h(Row, { title: 'Importing', value: 62 }), h(Row, { title: 'Done', value: 100, tone: 'done' }), h(Row, { title: 'Stopped by an error', value: 62, tone: 'error' }));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
