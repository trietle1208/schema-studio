<!doctype html>
<html>
<head><meta charset="utf-8"><title>DataGrid — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%} .cap{padding:10px 12px 6px}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement, useState = React.useState;
var users = S.sample.tables[0], orders = S.sample.tables[1], payments = S.sample.tables[4];
function Block(p){ return h('div',{style:{display:'flex',flexDirection:'column',height:p.height,background:'var(--bg-1)',borderTop:'1px solid var(--line-1)'}}, h('div',{className:'cap ss-caption',style:{background:'var(--bg-2)'}},p.title), p.children); }
function App(){
  var _s = useState([1,2]), sel = _s[0], setSel = _s[1];
  var _a = useState({row:3,column:'email'}), act = _a[0], setAct = _a[1];
  return h('div',{style:{display:'flex',flexDirection:'column'}},
    h(Block,{title:'users · selected rows, active cell, modified cell, sorted column · right-click a row for its menu',height:340},
      h(S.DataGrid,{columns:users.columns,rows:S.sample.records.users,selected:sel,onSelect:setSel,activeCell:act,onActiveCell:setAct,modified:[{row:3,column:'name'}],sort:{column:'id',dir:'asc'},label:'users',onRowAction:function(){}})),
    h(Block,{title:'orders · compact, loading',height:196}, h(S.DataGrid,{columns:orders.columns,rows:[],loading:true,density:'compact'})),
    h(Block,{title:'payments · empty',height:196}, h(S.DataGrid,{columns:payments.columns,rows:[],empty:true})));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
