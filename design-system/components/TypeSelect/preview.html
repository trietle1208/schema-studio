<!doctype html>
<html>
<head><meta charset="utf-8"><title>TypeSelect — preview</title>
<style>html,body{margin:0;height:100%;background:var(--bg-2)} #root{height:100%}</style></head>
<body>
<div id="root" class="ss-root"></div>
<script>
var S = window.SchemaStudio, h = React.createElement, useState = React.useState;
function App(){
  var _v = useState('VARCHAR(255)'), v = _v[0], setV = _v[1];
  return h('div',{className:'ss-demo',style:{alignItems:'flex-start'}}, h('div',{style:{width:240}}, h(S.TypeSelect,{value:v,onChange:setV,defaultOpen:true})), h('span',{className:'ss-faint ss-mono',style:{fontSize:12,marginLeft:'auto'}}, 'value: '+v));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
